name: Sync upstream

on:
  schedule:
    - cron: "*/30 * * * *"
  # Re-sync right after a PR lands on the default branch: merging a conflict
  # resolution or the sync PR moves main, which can unblock/retire open
  # conflicts before the next cron tick (see WORKFLOW-RULES §4/§5.5).
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      retry_sha:
        description: "SHA (or prefix) of a previously skipped commit to try again"
        required: false
        default: ""
      dry_run:
        description: "Simulate only: no push, PR, issues or Discord messages"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

# Never two runs at once (a slow run must not race the next one)
concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    # On pull_request events only run when the PR actually merged into the
    # default branch (stack PRs merged into another branch don't move main),
    # from a branch of this same repo — fork PRs run without secrets, so they
    # are left to the schedule.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GIT_USER_NAME: PentSec
      GIT_USER_EMAIL: 11955573+PentSec@users.noreply.github.com
      GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # pull_request events check out refs/pull/N/merge by default, which
          # on a closed PR can be stale or gone; the script copy must come
          # from the default branch.
          ref: ${{ github.event.repository.default_branch || 'main' }}
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install Lua (syntax check)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1

      - name: Sync
        env:
          RETRY_SHA: ${{ inputs.retry_sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Run from a copy: the script switches branches while it runs.
          cp .github/scripts/sync-upstream.sh "$RUNNER_TEMP/sync-upstream.sh"
          bash "$RUNNER_TEMP/sync-upstream.sh"

      # Community workaround so GitHub doesn't auto-disable the schedule after 60 idle days.
      - name: Keep the schedule alive
        continue-on-error: true
        run: gh api -X PUT "repos/${GH_REPO}/actions/workflows/sync-upstream.yml/enable"

      - name: Notify recovery
        if: success()
        run: |
          # Only success/failure count as "previous": skipped runs (closed PRs)
          # must not break the anti-spam or hide a recovery.
          PREV=$(gh run list --workflow sync-upstream.yml --status completed --limit 20 \
                   --json conclusion \
                   --jq '[.[] | select(.conclusion=="success" or .conclusion=="failure")][0].conclusion // ""' || true)
          if [ "$PREV" = "failure" ] && [ -n "${DISCORD_WEBHOOK:-}" ]; then
            jq -n --arg c "✅ **DragonUI sync** is working again." '{content: $c}' \
              | curl -fsS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK" || true
          fi

      # Only alerts on the FIRST failure in a row, so a persistent problem doesn't spam every 30 min.
      - name: Notify failure
        if: failure()
        run: |
          # Only success/failure count as "previous": skipped runs (closed PRs)
          # must not break the anti-spam or hide a recovery.
          PREV=$(gh run list --workflow sync-upstream.yml --status completed --limit 20 \
                   --json conclusion \
                   --jq '[.[] | select(.conclusion=="success" or .conclusion=="failure")][0].conclusion // ""' || true)
          if [ "$PREV" != "failure" ] && [ -n "${DISCORD_WEBHOOK:-}" ]; then
            jq -n --arg c "🔴 **DragonUI sync failed** — ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                  '{content: $c}' \
              | curl -fsS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK" || true
          fi
